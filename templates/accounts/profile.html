{% extends "base.html" %}

{% block title %}
My Profile - SkillHub
{% endblock %}

{% block content %}

<h1>My Profile</h1>

<p>
    Username: {{ user.username }}
</p>

<p>
    Email: {{ user.email }}
</p>

<p>
    Role: {{ user.get_role_display }}
</p>

<form method="post" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Update Profile
    </button>

</form>

{% endblock %}
